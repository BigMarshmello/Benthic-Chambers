# =====================================================================
# Benthic chamber O2 flux process model -- master parameter file
# =====================================================================
# Every parameter carries: value, units (SI), range, status, source.
#
# status codes:
#   MEASURED       - your measured value, already entered
#   PLACEHOLDER    - YOU MUST MEASURE OR SUPPLY THIS. value is null or a
#                    deliberately generic stand-in. Never treat as a result.
#   LITERATURE     - taken from a cited published source
#   ASSUMPTION     - my choice, defensible but unverified. VERIFY.
#   DERIVED        - computed at runtime from other parameters
#   NUMERICAL      - solver setting, no physical meaning
#
# Sign / axis convention used everywhere:
#   z is POSITIVE DOWNWARD, z = 0 at the sediment-water interface (SWI).
#   Fluxes are POSITIVE INTO THE SEDIMENT (i.e. O2 uptake is positive).
#   Pressure p is the DYNAMIC (non-hydrostatic) pressure; gravity is
#   absorbed into the reference state and does not appear in Darcy.
#
# Basis convention (see docs/stage0_physics_and_assumptions.md sec. 2.3):
#   R(C) and alpha(z) are defined PER UNIT VOLUME OF POREWATER.
#   They enter the transport equation multiplied by phi.
#   Bulk-basis equivalents are R_bulk = phi*R, alpha_bulk = phi*alpha.
# =====================================================================

meta:
  project: "Benthic chamber O2 flux -- Langebaan Lagoon sandprawn flats"
  stage: 0
  units_system: SI
  notes: >
    Stage 0 is a specification only. No transport solver exists yet.
    Any number tagged PLACEHOLDER or ASSUMPTION must not be quoted as a
    model result.

# ---------------------------------------------------------------------
# 1. SITE / WATER COLUMN
# ---------------------------------------------------------------------
site:
  name:
    value: "Langebaan Lagoon, Western Cape, South Africa"
    status: MEASURED

  temperature:
    value: 16.0
    units: degC
    range: [10.0, 24.0]
    status: PLACEHOLDER
    source: >
      Deploy a temperature logger INSIDE the chamber. A clear perspex
      chamber on an intertidal flat heats measurably during a daytime
      deployment; T controls both D_0 and O2 solubility, and respiration
      roughly doubles per 10 degC (Q10 ~ 2). Range is a generic west-coast
      seasonal span, not a measurement.

  salinity:
    value: 35.0
    units: g_per_kg
    range: [34.0, 37.0]
    status: PLACEHOLDER
    source: >
      Langebaan is a marine embayment with no significant freshwater
      input; upper-lagoon evaporation can push salinity slightly above
      open-ocean values. Measure with the DO sensor's conductivity cell
      or a refractometer.

  water_depth:
    value: 0.5
    units: m
    range: [0.10, 3.0]
    status: PLACEHOLDER
    source: >
      Enters the Elliott & Brooks (1997) bed-head relation as 'd'.
      INTERTIDAL SITE: this changes continuously through the tide and the
      relation is meaningless as d -> 0. Record depth at the SWI at the
      start and end of each deployment. Model runs represent one tidal
      stage (a snapshot), not a tidal cycle.

  free_stream_velocity:
    value: 0.10
    units: m_per_s
    range: [0.02, 0.40]
    status: PLACEHOLDER
    source: >
      Elliott & Brooks calibrated against Fehlman (1985) flume data using
      the MEAN (depth-averaged) stream velocity, not the free-stream
      velocity above the boundary layer. See stage0 note sec. 3.2 --
      this is a real definitional mismatch in the original prompt.
      Measure with an ADV/impeller at a stated height, and record that
      height.

  gravity:
    value: 9.81
    units: m_per_s2
    status: LITERATURE
    source: "Standard gravity; local value at 33 S differs by <0.1%."

  water_density:
    value: 1025.0
    units: kg_per_m3
    range: [1020.0, 1028.0]
    status: DERIVED
    source: "Computed from T,S at runtime; value here is a fallback."

  dynamic_viscosity:
    value: 1.19e-3
    units: Pa_s
    range: [0.95e-3, 1.40e-3]
    status: DERIVED
    source: >
      Seawater viscosity at T,S. Fallback value is approx. 16 degC,
      S=35. Will be computed at runtime (Sharqawy et al. 2010 correlation).
      Strongly temperature dependent -- a 6 degC error is a ~15% error in
      every Darcy velocity.

  o2_saturation:
    value: 2.50e-1
    units: mol_per_m3
    range: [2.0e-1, 3.0e-1]
    status: DERIVED
    source: >
      Air-saturation O2 concentration from Garcia & Gordon (1992),
      L&O 37:1307-1312 (Benson & Krause combined fit). Fallback ~250
      umol/L is approx. 16 degC, S=35, 1 atm. IMPLEMENTATION MUST BE
      CHECKED against a published table value before use (stage 1 test).
      Sensor conversion: 1 mol/m3 = 1000 umol/L = 32.0 mg/L.

# ---------------------------------------------------------------------
# 2. SEDIMENT PHYSICAL PROPERTIES
# ---------------------------------------------------------------------
sediment:
  porosity:
    value: 0.40
    units: dimensionless
    range: [0.35, 0.45]
    status: PLACEHOLDER
    source: >
      Your stated range. Measure by wet/dry weight on cores. Assumed
      depth-uniform (see stage0 note sec. 6, limitation L3).

  permeability:
    value: null
    units: m2
    range: [1.0e-12, 1.0e-10]
    sweep_default: 1.0e-11
    status: PLACEHOLDER
    source: >
      NOT YET MEASURED -- you confirmed this. Until measured, permeability
      is the model's primary swept axis, not an input. Range is the
      standard permeable-sand band (Huettel & Webster 2001: advection
      matters above ~1e-12 m2). Measure with a constant-head permeameter
      on intact cores, or estimate from d50 via Hazen/Kozeny-Carman and
      report that it is an estimate.
      Your quoted thresholds (3e-12 and 2.6e-11 m2) are reproduced
      independently by the scaling analysis in benthic/scaling.py --
      see stage0 note sec. 5.

  median_grain_size:
    value: null
    units: m
    range: [1.5e-4, 5.0e-4]
    status: PLACEHOLDER
    source: >
      Sieve or laser diffraction on your cores. Langebaan intertidal
      sediments are a mix of a fine terrigenous quartz population and a
      coarser skeletal carbonate population (Flemming, Saldanha Bay /
      Langebaan depositional processes), so the distribution may be
      bimodal and a single d50 can be misleading for permeability
      estimation. Report sorting as well.

  sorting_sigma:
    value: null
    units: phi_units
    status: PLACEHOLDER
    source: "Needed if permeability is estimated rather than measured."

  tortuosity_model:
    value: "boudreau1996"
    options: ["boudreau1996", "archie", "none"]
    status: LITERATURE
    source: >
      theta^2 = 1 - ln(phi^2), the modified Weissberg relation of
      Boudreau (1996), Geochim. Cosmochim. Acta 60:3139-3142.
      CONFIRMED as stated in your prompt. At phi=0.40, theta^2 = 2.83,
      so D_s = D_0/2.83 = 0.354*D_0.

  d0_o2:
    value: 1.80e-9
    units: m2_per_s
    range: [1.4e-9, 2.2e-9]
    status: DERIVED
    source: >
      Free-solution O2 diffusivity in seawater at in-situ T,S. Computed
      at runtime; fallback is approx. 16 degC, S=35. Reference anchor
      ~1.97e-9 m2/s at 20 degC, S=35 (Ramsing & Gundersen, Unisense
      "Seawater and Gases" tables). Scale with Stokes-Einstein
      D ~ T/mu. VERIFY the implementation against the published table.

  diffusive_boundary_layer:
    value: 4.0e-4
    units: m
    range: [1.0e-4, 1.5e-3]
    status: ASSUMPTION
    source: >
      *** NOT IN THE ORIGINAL SPEC -- ADDED. *** The DBL is a stagnant
      film above the SWI across which O2 moves only by molecular
      diffusion. When the bed is diffusion-dominated it can carry a large
      fraction of the total transport resistance, and its thickness is
      set by near-bed shear -- which the chamber CHANGES. This makes it a
      first-order chamber-vs-field bias mechanism.
      Typical marine values 0.2-1.0 mm. Will be tied to friction
      velocity in stage 5. See stage0 note sec. 4.1 (gap G1).

# ---------------------------------------------------------------------
# 3. OXYGEN CONSUMPTION
# ---------------------------------------------------------------------
respiration:
  basis:
    value: "porewater"
    options: ["porewater", "bulk"]
    status: NUMERICAL
    source: >
      Controls whether R is per m3 porewater (entering as phi*R) or per
      m3 bulk sediment (entering as R). THIS CHOICE CHANGES THE ANALYTIC
      PENETRATION-DEPTH FORMULA BY sqrt(phi) -- the original prompt mixed
      the two conventions. See stage0 note sec. 2.3.

  model:
    value: "monod"
    options: ["zero_order", "first_order", "monod"]
    status: NUMERICAL
    source: >
      Default is Monod because pure zero-order drives C negative below
      the oxic layer and needs a free-boundary treatment. Monod with a
      small K_m is numerically safe and reduces to zero-order for
      C >> K_m, so the stage-1 analytic check still applies in the oxic
      zone.

  rate_zero_order:
    value: 1.0e-4
    units: mol_per_m3_porewater_per_s
    range: [1.0e-5, 1.0e-3]
    status: PLACEHOLDER
    source: >
      = 8.6 mol m-3 d-1. Generic sandy-intertidal value chosen so that
      the stage-1 analytic solution gives a ~2.4 mm oxygen penetration
      depth and a ~8 mmol m-2 d-1 diffusive uptake, both plausible for a
      permeable sandflat. THIS IS A STAND-IN, NOT A MEASUREMENT.
      Measure by whole-core incubation or by fitting a microprofile.
      Bulk-basis equivalent: phi*R = 4.0e-5 mol m-3(bulk) s-1.

  rate_first_order:
    value: 4.0e-4
    units: per_s
    range: [4.0e-5, 4.0e-3]
    status: ASSUMPTION
    source: "Chosen so k1*C_sat matches rate_zero_order at saturation."

  monod_km:
    value: 1.0e-3
    units: mol_per_m3
    range: [1.0e-4, 2.0e-2]
    status: LITERATURE
    source: >
      Half-saturation constant for aerobic respiration, ~1 uM. Reported
      values span roughly 0.1-20 uM. Small relative to C_sat (250 uM),
      so respiration is near zero-order through most of the oxic layer.

  q10:
    value: 2.0
    units: dimensionless
    range: [1.5, 3.0]
    status: ASSUMPTION
    source: >
      Used only to correct R between the measurement temperature and the
      in-situ temperature. Matters because a clear perspex chamber heats.

# ---------------------------------------------------------------------
# 4. PHOTOSYNTHESIS -- REQUIRED FOR YOUR LIGHT CHAMBER
# ---------------------------------------------------------------------
production:
  enabled:
    value: false
    status: NUMERICAL
    source: >
      *** NOT IN THE ORIGINAL SPEC -- ADDED after you mentioned a light
      and a dark chamber version. *** Set true for LIGHT deployments.
      Without this term the light chamber cannot be modelled at all: it
      measures net community metabolism (P - R), not respiration.
      See stage0 note sec. 4.2 (gap G2).

  pmax_volumetric:
    value: 2.0e-4
    units: mol_O2_per_m3_porewater_per_s
    range: [0.0, 2.0e-3]
    status: ASSUMPTION
    source: >
      Gross photosynthesis at saturating light in the microphytobenthos
      layer. Pure stand-in. Constrain it from your own paired light/dark
      chamber pairs, or from a benthic chlorophyll-a measurement.

  light_attenuation_length:
    value: 6.0e-4
    units: m
    range: [2.0e-4, 2.0e-3]
    status: LITERATURE
    source: >
      Scalar irradiance in sand falls off over roughly 0.2-2 mm depending
      on grain size and pigment load. Production is therefore confined to
      a layer THINNER than the oxygen penetration depth. Modelled as
      P(z) = Pmax * f(I) * exp(-z/L_light).

  surface_irradiance:
    value: null
    units: umol_photons_per_m2_per_s
    range: [0.0, 2000.0]
    status: PLACEHOLDER
    source: "Measure with a PAR sensor at the SWI, inside the chamber."

  ik_saturation:
    value: 200.0
    units: umol_photons_per_m2_per_s
    range: [50.0, 500.0]
    status: ASSUMPTION
    source: "Saturating irradiance in a P-I curve, P = Pmax*tanh(I/Ik)."

# ---------------------------------------------------------------------
# 5. BIOIRRIGATION (SANDPRAWNS)
# ---------------------------------------------------------------------
bioirrigation:
  species:
    value: "Kraussillichirus kraussi (formerly Callianassa / Callichirus kraussi)"
    status: MEASURED

  alpha0:
    value: 5.0e-6
    units: per_s
    range: [0.0, 1.0e-4]
    status: ASSUMPTION
    source: >
      Nonlocal exchange coefficient at the SWI, porewater basis.
      5e-6 s-1 = 158 yr-1. Published alpha0 for bioirrigated coastal
      sediments spans roughly 10-1000 yr-1 (Meile et al. 2001, inverse
      modelling). Dense callianassid beds sit at the top of that range.
      NO SPECIES-SPECIFIC alpha EXISTS FOR K. kraussi that I could
      verify, and you have confirmed you have no estimate either. Treat
      this as the single least constrained parameter in the model.
      The model's job is therefore to tell you HOW MUCH IT MATTERS: if
      stage 6 ranks alpha0 high, you need to measure it before any flux
      number is defensible.
      HOW TO MEASURE IT: add an inert tracer (bromide, or fluorescein)
      to the chamber water and fit its disappearance -- an inert tracer
      is removed only by irrigation and advection, not respiration, so
      it separates transport from consumption. This is the same trick
      Janssen et al. (2005) used to calibrate 'Sandy'.

  depth_profile:
    value: "exponential"
    options: ["exponential", "gaussian", "two_layer", "constant_to_depth"]
    status: ASSUMPTION
    source: >
      alpha(z) = alpha0 * exp(-z / z_irr).
      RATIONALE (this is the assumed profile you asked me to state):
      the exponential is the standard form and mimics the decline in
      burrow cross-sections with depth. K. kraussi burrows reach ~1 m,
      but that does NOT justify a 1 m irrigation length scale for OXYGEN,
      for two reasons -- (i) O2 is consumed within millimetres of any
      supplied surface, so deep burrow wall area contributes O2 uptake
      but the model's driving concentration there is wrong, and (ii)
      thalassinidean burrow water is ventilated in intermittent bouts and
      goes hypoxic/anoxic between them, so the true driving concentration
      at depth is well below C_w. Both push the EFFECTIVE O2 irrigation
      scale well above the surface but far shallower than the burrow.
      See stage0 note sec. 4.4 (gap G4).

  z_irr:
    value: 0.05
    units: m
    range: [0.01, 0.30]
    status: ASSUMPTION
    source: >
      e-folding depth of alpha(z). Deliberately much shallower than the
      burrow depth, per the rationale above. This is a fitted/uncertain
      parameter -- sensitivity analysis will say how much it matters.

  burrow_depth_max:
    value: 1.0
    units: m
    range: [0.3, 1.5]
    status: LITERATURE
    source: >
      K. kraussi burrows extend to ~1 m depth. IMPORTANT DESIGN
      CONSEQUENCE: a chamber inserted 0.05-0.20 m cannot enclose an
      intact burrow system -- it severs it. See stage0 note sec. 4.5
      (gap G5).

  prawn_density:
    value: 100.0
    units: individuals_per_m2
    range: [0.0, 250.0]
    status: PLACEHOLDER
    source: >
      Count burrow openings or pump/core a known area at your site.
      Reported dense aggregations reach 176-240 ind m-2 in South African
      estuarine populations. Drives both alpha0 and the between-chamber
      variance (see stage0 note sec. 4.6, gap G6).

  driving_concentration:
    value: "overlying_water"
    options: ["overlying_water", "reduced_at_depth"]
    status: ASSUMPTION
    source: >
      'overlying_water' is the classical alpha(z)*(C_w - C) form and is
      an UPPER BOUND on irrigative O2 supply at depth. 'reduced_at_depth'
      will apply a ventilation-efficiency factor. Implemented in stage 4.

  intermittency_duty_cycle:
    value: 1.0
    units: dimensionless
    range: [0.05, 1.0]
    status: ASSUMPTION
    source: >
      Fraction of time burrows are actively ventilated. 1.0 means the
      continuous-alpha idealisation. Real thalassinidean pumping is
      bursty; a time-averaged alpha is only valid if the deployment is
      long compared with the pumping period.

# ---------------------------------------------------------------------
# 6. FIELD CONFIGURATION (open bed + mounds, 2D Cartesian x-z)
# ---------------------------------------------------------------------
field:
  mound_height:
    value: 0.03
    units: m
    range: [0.005, 0.10]
    status: PLACEHOLDER
    source: >
      'H' in the Elliott & Brooks relation. Measure the relief of the
      sandprawn mound field (a ruler and a photo scale are enough).
      NOTE: the relation was calibrated on 2D triangular DUNES in a
      unidirectional freshwater flume. Sandprawn mounds are roughly
      conical, irregular and 3D. See stage0 note sec. 3.2.

  mound_wavelength:
    value: 0.30
    units: m
    range: [0.05, 1.0]
    status: PLACEHOLDER
    source: >
      'lambda'. Measure the mean spacing of mounds/ripples. Sets the
      depth of the advective circulation cell (decay scale lambda/2pi).

  bed_thickness:
    value: 0.50
    units: m
    range: [0.20, 2.0]
    status: ASSUMPTION
    source: >
      Modelled sediment thickness with an impermeable base. Must be
      >> lambda/2pi for the deep-bed exp(-2*pi*z/lambda) limit to hold;
      the finite-depth cosh form is used otherwise.

  head_amplitude_model:
    value: "elliott_brooks_1997"
    options: ["elliott_brooks_1997", "prescribed"]
    status: LITERATURE
    source: >
      h_m = 0.28 * (U^2 / 2g) * (H / (0.34*d))^n,
        n = 3/8  if H/d <= 0.34
        n = 3/2  if H/d >  0.34
      VERIFIED against the published form (Elliott & Brooks 1997, WRR
      33:123-136, after Fehlman 1985). Your version of this formula is
      CORRECT as written. h_m is a HEAD half-amplitude in metres; the
      pressure amplitude is p_m = rho_w * g * h_m.

  prescribed_head_amplitude:
    value: null
    units: m
    status: PLACEHOLDER
    source: "Override h_m directly if you measure bed pressure."

  phase_convention:
    value: "max_upstream_of_crest"
    options: ["max_at_crest", "max_upstream_of_crest"]
    status: ASSUMPTION
    source: >
      p(x) = p_m * sin(2*pi*x/lambda). Elliott & Brooks place the head
      maximum on the stoss side, upstream of the crest, with the minimum
      just downstream where the flow separates. This phase sets WHERE
      inflow and outflow zones sit relative to a mound; it does not change
      the total exchange in a steady periodic 2D bed.

# ---------------------------------------------------------------------
# 7. CHAMBER CONFIGURATION (axisymmetric r-z)
# ---------------------------------------------------------------------
chamber:
  variant:
    value: "dark"
    options: ["dark", "light"]
    status: MEASURED
    source: >
      You have both. 'light' requires production.enabled = true and
      measures net metabolism (P - R); 'dark' measures respiration.
      A clear perspex chamber must be actively shrouded to be 'dark',
      and a clear one heats in sun -- log temperature in both.

  bore:
    value: 0.168
    units: m
    range: [0.160, 0.175]
    status: MEASURED
    source: >
      INTERNAL diameter of the production chamber (168 mm bore, 200 mm
      OD acrylic tube). This is the dimension that matters: the enclosed
      sediment area is A = pi*(bore/2)^2 = 0.02217 m2.
      SUPERSEDES the 0.30 m stage-0 placeholder. The real chamber
      encloses 31% of the area I first assumed, which changes the
      sensitivity conclusion -- see stage0 note sec. 12.

  outer_diameter:
    value: 0.200
    units: m
    range: [0.195, 0.205]
    status: MEASURED
    source: "200 mm OD acrylic tube."

  wall_thickness:
    value: 0.016
    units: m
    status: DERIVED
    source: >
      (OD - bore)/2 = 16 mm. Thick. On insertion this displaces a 16 mm
      annulus of sand and compacts the rim, which is exactly where the
      stirrer-driven downwelling enters. Local permeability at the wall
      may not equal bulk permeability. Not modelled; flagged as a
      limitation (stage0 note L9).

  tube_length:
    value: 0.60
    units: m
    range: [0.40, 1.00]
    status: PLACEHOLDER
    source: >
      Total tube length. You said "maybe around 60 cm, maybe slightly
      longer, definitely less than 1 m". MEASURE IT -- the water column
      height sets the flux sensitivity directly (dC_w/dt = J/h), and the
      difference between 0.6 m and 0.9 m is a 1.6x change in how long you
      must sit on station. Range spans your stated uncertainty.

  insertion_depth:
    value: 0.10
    units: m
    range: [0.05, 0.20]
    status: PLACEHOLDER
    source: >
      'd_ins'. Impermeable wall from the SWI to this depth; porewater may
      pass beneath the wall edge. Shallow insertion short-circuits the
      stirrer-driven flow; deep insertion truncates the deep pathway.
      Expected to be a top-ranked bias parameter in stage 6.

  height_above_sediment:
    value: null
    units: m
    status: DERIVED
    source: >
      h = tube_length - insertion_depth. At the defaults, 0.50 m.
      This is the single most important number for whether your
      deployment produces a usable signal.

  water_volume:
    value: null
    units: m3
    status: DERIVED
    source: >
      V = pi*(bore/2)^2 * h. At the defaults, 11.1 L.
      BETTER: measure V directly by filling the assembled chamber,
      because stirrer, sensor, lid and ports all displace water.

  aspect_ratio_max:
    value: 2.0
    units: dimensionless
    status: LITERATURE
    source: >
      *** ADDED AT REVISION 1. *** Water-column height divided by bore.
      The stirred-chamber designs this model is calibrated against run
      at roughly 1.5-1.7 : 1 (Huettel & Gust 1992: 30 cm tall, 19 cm ID;
      Janssen et al. 2005 'Sandy': same). The production chamber at
      0.50 m / 0.168 m is 3.0 : 1, and up to 4.8 : 1 at a 0.9 m tube.
      This value is the upper bound of the CALIBRATED envelope, not a
      limit on what the model will run -- exceeding it triggers a
      warning, because two assumptions start to fail (well-mixed water
      column, and swirl reaching the bed). See stirrer_transfer_efficiency.

  stirrer_pressure:
    value: 0.84
    units: Pa
    range: [0.0, 3.0]
    status: LITERATURE
    source: >
      'delta_p_s', the centre-to-wall dynamic pressure difference AT THE
      SEDIMENT SURFACE, with p(r) = delta_p_s * (r/R)^2 (forced-vortex
      form -- the r^2 shape in your prompt is CORRECT for solid-body
      rotation).
      CALIBRATION ANCHOR: Huettel & Gust (1992), MEPS 82:187-197, set a
      radial gradient of 0.2 Pa cm-1, stated as equivalent to a 10 cm s-1
      bottom flow over a 7 cm ripple. The rim gradient is 2*delta_p_s/R,
      so 0.2 Pa cm-1 at R = 0.084 m gives delta_p_s = 0.84 Pa.
      REVISED at revision 1 from 1.50 Pa: the anchor is a pressure
      GRADIENT, so the smaller bore needs a proportionally smaller
      centre-to-wall difference to reproduce it.
      SIGN: pressure is LOW at the centre, HIGH at the wall, so the model
      must predict porewater DOWNWELLING near the wall and UPWELLING at
      the centre -- the pattern Huettel & Gust observed. This is a
      falsifiable stage-5 check.

  stirrer_transfer_efficiency:
    value: 1.0
    units: dimensionless
    range: [0.1, 1.0]
    status: ASSUMPTION
    source: >
      *** ADDED AT REVISION 1 -- READ THIS ONE. *** Fraction of the
      stirrer's nominal pressure field that actually reaches the
      sediment surface. 1.0 means the forced vortex is fully developed
      down to the bed, which is what the published chamber designs
      achieve at ~1.6 : 1 aspect ratio with the disc close to the bed.
      In a tube 3-5 bore diameters tall the swirl decays before it
      reaches the sediment, so the real delta_p_s at the SWI is LOWER
      than the stirrer setting -- possibly much lower.
      I HAVE NO BASIS FOR A NUMBER HERE for this geometry. 1.0 is the
      optimistic bound, deliberately, so the model over- rather than
      under-states chamber advection until it is calibrated.
      CALIBRATE IT: a tracer (dye or brine) release in the chamber over
      an impermeable plate, or a differential pressure measurement
      centre-to-wall at the bed. Until then, sweep 0.1-1.0 and treat
      chamber advective flux as uncertain to an order of magnitude.

  well_mixed_assumption:
    value: true
    status: NUMERICAL
    source: >
      The chamber water balance treats C_w as uniform. In a 0.5 m tall,
      0.168 m bore tube this is a real assumption, not a formality --
      and a clear chamber in sun can stratify thermally, which would
      make the DO sensor read a local value rather than C_w.
      PRACTICAL CHECK: a second DO sensor at a different height, or a
      dye test. If they disagree, the flux is wrong regardless of
      everything else in this model.

  sensor_resolution:
    value: 0.4
    units: umol_per_m3_times_1000
    range: [0.1, 2.0]
    status: PLACEHOLDER
    source: >
      *** ADDED AT REVISION 1. *** Resolution of YOUR DO sensor in
      umol/L (optodes are typically 0.1-0.4 umol/L resolution but
      +/-2 umol/L absolute accuracy; what matters for a flux is
      short-term stability and drift, not absolute accuracy).
      Needed because the signal-to-noise calculation is now the
      binding constraint on this chamber design -- see stage0 note
      sec. 12. Enter your actual sensor spec.

  sensor_drift:
    value: 0.5
    units: umol_per_L_per_hour
    range: [0.0, 3.0]
    status: PLACEHOLDER
    source: >
      Drift over a deployment. With a 0.5 m water column the
      diffusion-only signal is ~0.5 umol/L/h, so drift of this order
      is NOT a second-order correction -- it is the same size as the
      thing you are measuring. Characterise it with a sealed blank.

  water_column_respiration:
    value: 0.0
    units: mol_per_m3_per_s
    range: [0.0, 5.0e-8]
    status: ASSUMPTION
    source: >
      Pelagic respiration in the enclosed water. Usually small but not
      always negligible over a long deployment; it is indistinguishable
      from sediment uptake in the dC_w/dt signal. A dark water-only blank
      (chamber sealed off the bed) measures it. NOTE: this scales with V
      while the sediment signal scales with A, so a tall chamber is
      disproportionately vulnerable to it.

  deployment_duration:
    value: 14400.0
    units: s
    range: [900.0, 86400.0]
    status: PLACEHOLDER
    source: >
      How long you actually log DO for. REVISED at revision 1 from 1 h
      to 4 h, and the upper bound from 4 h to 24 h: with a 0.5 m water
      column the diffusion-only case needs ~97 h to reach 20% drawdown,
      so a 1 h deployment is not viable for a low-permeability,
      prawn-free patch. See stage0 note sec. 12.

  max_drawdown_fraction:
    value: 0.20
    units: dimensionless
    range: [0.05, 0.50]
    status: ASSUMPTION
    source: >
      Stop the incubation before C_w falls by more than this fraction.
      Flux depends on C_w, so a long incubation measures a declining
      flux and a linear fit under-reads the in-situ value. Stage 5
      quantifies this bias explicitly.

  replicates:
    value: 6
    units: count
    range: [1, 30]
    status: ASSUMPTION
    source: >
      *** ADDED AT REVISION 1. *** Number of chamber deployments per
      treatment. At 0.02217 m2 enclosed area and 100 prawns m-2, a
      chamber holds a mean of 2.2 prawns, so Poisson counting noise on
      prawn number alone gives a 67% coefficient of variation between
      chambers; 6 replicates brings that to ~27%. Stage 6 reports this
      properly. This is a study-design number, not a physical parameter.

  flux_estimator:
    value: "initial_slope"
    options: ["initial_slope", "linear_fit_full", "exponential_fit"]
    status: NUMERICAL
    source: >
      How the flux is back-computed from C_w(t), i.e. what YOU would do
      with sensor data. Comparing estimators against the model's true
      instantaneous flux is one of the deliverables.

  stirrer_dbl_thickness:
    value: 4.0e-4
    units: m
    range: [1.0e-4, 1.5e-3]
    status: ASSUMPTION
    source: >
      DBL inside the chamber. Deliberately a SEPARATE parameter from
      sediment.diffusive_boundary_layer so that chamber-vs-field DBL
      mismatch can be isolated as a bias term.

# ---------------------------------------------------------------------
# 8. NUMERICS
# ---------------------------------------------------------------------
numerics:
  nx:
    value: 120
    units: cells
    status: NUMERICAL
  nz:
    value: 200
    units: cells
    status: NUMERICAL
  z_grading:
    value: "geometric"
    options: ["uniform", "geometric"]
    status: NUMERICAL
    source: >
      The oxic layer is ~1-5 mm thick over a 0.5 m domain. A uniform grid
      cannot resolve it affordably; cells are graded fine at the SWI.
  dz_min:
    value: 5.0e-5
    units: m
    status: NUMERICAL
    source: "50 um at the SWI -- ~50 cells across a 2.5 mm oxic layer."
  advection_scheme:
    value: "tvd_van_leer"
    options: ["upwind", "tvd_van_leer"]
    status: NUMERICAL
  grid_peclet_warn:
    value: 2.0
    units: dimensionless
    status: NUMERICAL
    source: "Warn if cell Pe = |q|*dz/(phi*D_s) exceeds this."
  mass_balance_tolerance:
    value: 0.01
    units: fraction
    status: NUMERICAL
    source: "Global O2 balance must close to <1%. Printed every run."
  steady_tolerance:
    value: 1.0e-10
    units: relative
    status: NUMERICAL
